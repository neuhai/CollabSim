<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GUI Error</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fb;
        --card: #ffffff;
        --border: #e0e4ef;
        --text: #1b1f2a;
        --accent: #1e5eff;
      }
      body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
      main { padding: 32px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; max-width: 720px; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>GUI Error</h1>
        <p>{{ message }}</p>
        <p><a href="{{ url_for('index') }}">Back to home</a></p>
      </div>
    </main>
  </body>
</html>
