[project]
name = "agent-collaboration-simulation"
version = "0.1.0"
description = "Multi-agent collaboration simulation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "pyyaml",
    "httpx",
    "litellm>=1.55.0",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
