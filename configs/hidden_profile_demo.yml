experiment:
  id: "hidden_profile_demo_v1"
  seed: 42
  max_steps: 3
prompts:
  system: "prompts/system_instructions.md"
  persona: "prompts/persona_profile.md"
  task: "prompts/task_instructions.md"
  protocol: "prompts/protocol.md"
  action_space: "prompts/action_space.md"
  return_format: "prompts/return_format.md"
  action: "prompts/action_prompt.md"
  probe: "prompts/probe_prompt.md"
  persona_profiles: "prompts/persona_profiles.json"
agents:
  - id: "A"
    role: "planner"
    model: { provider: "openai", name: "gpt-4.1" }
  - id: "B"
    role: "planner"
    model: { provider: "openai", name: "gpt-4.1" }
action_space:
  enabled: ["communicate", "decide"]
  decide:
    reveal: "aggregated"
controls:
  communication:
    mode: "broadcast"
    max_messages_per_turn: 1
  information_distribution:
    visibility: "asymmetric"
  visibility_defaults:
    task_state: ["shared_facts", "private_facts", "target_steps", "steps_taken", "complete"]
    resources: ["*"]
    turn_state: ["*"]
    buffers: ["*"]
task:
  type: "hidden_profile"
  target_steps: 3
  shared_facts:
    - "Objective is to pick the optimal plan."
  private_facts:
    A:
      - "Plan X is low risk."
    B:
      - "Plan Y yields higher reward."
protocol:
  turn_taking: "simultaneous"
  step_mode: "event"
  termination: { condition: "max_steps" }
  memory_turn_limit: 7
probe:
  cadence: "per_action"
  templates: ["grounding_v1", "coordination_v1"]
  questions_path: "prompts/interview_questions.json"
logging:
  trace_schema_version: "v0"
  output_dir: "experiments/hidden_profile_demo"
  observation_events: true
