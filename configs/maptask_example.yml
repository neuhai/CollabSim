experiment:
  id: "maptask_v1"
  type: "maptask"
  seed: 29
  max_steps: 120

prompts:
  system: "prompts/system_instructions.md"
  persona: "prompts/persona_profile.md"
  task: "prompts/task_maptask_instructions.md"
  protocol: "prompts/protocol.md"
  action_space: "prompts/action_space.md"
  return_format: "prompts/return_format_maptask.md"
  action: "prompts/action_prompt_maptask.md"
  probe: "prompts/probe_prompt.md"
  persona_profiles: "prompts/persona_profiles.json"

agents:
  - id: "A"
    role: "guider"
    model:
      provider: "azure"
      name: "gpt-5.3-codex"
      temperature: 0.0
  - id: "B"
    role: "follower"
    model:
      provider: "azure"
      name: "gpt-5.3-codex"
      temperature: 0.0

action_space:
  enabled: ["communicate", "update_map_progress", "do_nothing"]

controls:
  communication:
    mode: "direct"
    max_messages_per_turn: 2

task:
  type: "maptask"
  target_steps: 10000
  # When true, the guider's observation includes follower route cells (map_progress events + task state).
  canvas_visibility: true
  landmarks_path: "maptask_landmarks_cells.yml"
  roles:
    A: "guider"
    B: "follower"

protocol:
  turn_taking: "simultaneous"
  step_mode: "event"
  termination:
    condition: "max_steps"
    noop_consecutive_cycles: 2
  memory_turn_limit: 7

probe:
  cadence: "per_action"
  templates: ["situation_awareness_v1"]
  questions_path: "prompts/interview_questions_map_task.json"

logging:
  trace_schema_version: "v0"
  output_dir: "experiments/maptask_v1"
  observation_events: true
