experiment:
  id: "maptask_v1"
  seed: 29
  max_steps: 12

prompts:
  system: "prompts/system_instructions.md"
  persona: "prompts/persona_profile.md"
  task: "prompts/task_maptask_instructions.md"
  protocol: "prompts/protocol.md"
  action_space: "prompts/action_space.md"
  return_format: "prompts/return_format.md"
  action: "prompts/action_prompt.md"
  probe: "prompts/probe_prompt.md"
  persona_profiles: "prompts/persona_profiles.json"

agents:
  - id: "A"
    role: "guider"
    model:
      provider: "azure_openai"
      name: "gpt-5.3-codex"
      temperature: 0.0
  - id: "B"
    role: "follower"
    model:
      provider: "azure_openai"
      name: "gpt-5.3-codex"
      temperature: 0.0

action_space:
  enabled: ["communicate", "update_map_progress", "do_nothing"]

controls:
  communication:
    mode: "direct"
    max_messages_per_turn: 2

task:
  type: "maptask"
  target_steps: 10
  roles:
    A: "guider"
    B: "follower"
  maps:
    A:
      map_id: "guide_map_1"
      landmarks: ["river", "bridge", "tower"]
    B:
      map_id: "follow_map_1"
      landmarks: ["river", "bridge", "tower"]

protocol:
  turn_taking: "simultaneous"
  step_mode: "event"
  termination:
    condition: "max_steps"
  memory_turn_limit: 7

probe:
  cadence: "per_action"
  templates: ["situation_awareness_v1"]
  questions_path: "prompts/interview_questions.json"

logging:
  trace_schema_version: "v0"
  output_dir: "experiments/maptask_v1"
  observation_events: true
